<style>
  input::-ms-reveal,
  input::-ms-clear {
    display: none;
  }
</style>
<div class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-200">
    
    <div class="p-8 text-center bg-indigo-600 text-white">
      <h2 class="text-2xl font-black uppercase">Gestionnaire Achats & Ventes</h2>
      <p class="text-indigo-100 text-sm">Connectez-vous pour continuer</p>
    </div>

    <form (ngSubmit)="onLogin()" autocomplete="off" class="p-8 space-y-6">
      
      <input type="email" name="email" [(ngModel)]="loginData.email"
             placeholder="Email" autocomplete="none"
             class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-indigo-500">
      
      <div class="relative">
        <input [type]="isPasswordVisible ? 'text' : 'password'" 
               name="password" [(ngModel)]="loginData.password"
               placeholder="Mot de passe" autocomplete="new-password"
               class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-indigo-500">
        
        <button type="button" 
                (click)="isPasswordVisible = !isPasswordVisible"
                class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-indigo-600 transition-colors">
          <svg *ngIf="!isPasswordVisible" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.644C3.67 8.5 7.652 4.5 12 4.5c4.348 0 8.33 4 9.964 7.178.07.132.07.276 0 .408C20.33 15.5 16.348 19.5 12 19.5c-4.348 0-8.33-4-9.964-7.178Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
          </svg>
          <svg *ngIf="isPasswordVisible" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
          </svg>
        </button>
      </div>

      <button type="submit" 
        class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-indigo-700 transition-all active:scale-95">
        Se Connecter
      </button> 

    </form>
  </div>
</div>
