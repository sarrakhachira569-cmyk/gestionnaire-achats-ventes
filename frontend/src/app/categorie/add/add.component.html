<style>
  input::placeholder, textarea::placeholder {
    color: #cbd5e1 !important;
    opacity: 1;
  }
</style>

<div class="fixed inset-0 z-[150] flex items-start justify-center p-4 pt-20 overflow-y-auto bg-slate-900/40 backdrop-blur-sm">
  <div class="fixed inset-0 -z-10" (click)="cancel()"></div>

  <div class="relative bg-white w-full max-w-lg rounded-[2.5rem] shadow-2xl border border-slate-100 overflow-hidden flex flex-col animate-in zoom-in duration-300">
    
    <div class="px-10 pt-10 pb-6 text-center shrink-0">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-500 rounded-[1.5rem] shadow-lg mb-4 -rotate-3">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path>
        </svg>
      </div>
      <h2 class="text-2xl font-black text-slate-900 tracking-tight uppercase">Nouvelle <span class="text-emerald-500">Catégorie</span></h2>
      <p class="text-xs text-slate-400 font-bold mt-1 uppercase tracking-widest">Organisez vos produits par type</p>
    </div>

    <form #catForm="ngForm" (submit)="onSubmit(catForm)" class="px-10 py-4 space-y-6">
      
      <div class="space-y-2">
        <label class="text-[11px] font-black uppercase text-slate-500 ml-1 tracking-wider">Nom de la catégorie *</label>
        <input type="text" [(ngModel)]="newCategorie.title" name="title" #title="ngModel" required
               [class.border-red-500]="title.invalid && (title.touched || catForm.submitted)"
               class="w-full px-6 py-4 bg-slate-50 border border-slate-100 focus:border-emerald-500 rounded-2xl outline-none font-bold text-slate-700 transition-all shadow-sm"
               placeholder="Ex: Électronique, Beauté, Stock...">
        <p *ngIf="title.invalid && (title.touched || catForm.submitted)" class="text-[10px] text-red-600 font-black ml-2 uppercase italic">Ce champ est obligatoire</p>
      </div>

      <div class="space-y-2 pb-6">
        <label class="text-[11px] font-black uppercase text-slate-500 ml-1 tracking-wider">Description *</label>
        <textarea [(ngModel)]="newCategorie.description" name="description" #desc="ngModel" required
                  [class.border-red-500]="desc.invalid && (desc.touched || catForm.submitted)"
                  class="w-full px-6 py-4 bg-slate-50 border border-slate-100 focus:border-emerald-500 rounded-2xl outline-none font-bold text-slate-700 min-h-[120px] shadow-sm"
                  placeholder="Décrivez brièvement cette catégorie..."></textarea>
        <p *ngIf="desc.invalid && (desc.touched || catForm.submitted)" class="text-[10px] text-red-600 font-black ml-2 uppercase italic">La description est requise</p>
      </div>

      <div class="py-8 bg-slate-50/80 -mx-10 px-10 border-t flex gap-5">
        <button type="button" (click)="cancel()" 
                class="flex-1 py-4 font-black text-slate-400 uppercase tracking-widest text-[11px] hover:text-slate-600 transition-all">
          Annuler
        </button>
        
        <button type="submit" 
                [disabled]="catForm.invalid"
                [class.opacity-50]="catForm.invalid"
                [class.cursor-not-allowed]="catForm.invalid"
                class="flex-[2] bg-emerald-500 text-white py-4 rounded-2xl font-black uppercase tracking-widest text-[11px] shadow-xl shadow-emerald-100 hover:bg-emerald-600 active:scale-95 transition-all">
          Enregistrer la catégorie
        </button>
      </div>
    </form>
  </div>
</div>
