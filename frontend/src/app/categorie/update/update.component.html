<div class="p-8 antialiased font-sans bg-slate-50/50 min-h-screen">
  
  <div class="max-w-2xl mx-auto flex items-center mb-4">
    <button (click)="cancel()" 
            class="group flex items-center gap-3 text-slate-400 hover:text-emerald-500 transition-all duration-300">
      <div class="p-2.5 bg-white rounded-xl border border-slate-100 group-hover:border-emerald-200 group-hover:bg-emerald-50 shadow-sm transition-all">
        <svg class="w-4 h-4 text-slate-500 group-hover:text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path>
        </svg>
      </div>
      <span class="text-[9px] font-black uppercase tracking-[0.2em] opacity-60 group-hover:opacity-100 transition-opacity">
        Retour à la liste
      </span>
    </button>
  </div>

  <div class="max-w-2xl mx-auto bg-white rounded-[2.5rem] border border-slate-100 shadow-2xl p-10 mt-2">
    
    <div class="mb-10 text-center">
      <h1 class="text-3xl font-black text-slate-900 uppercase tracking-tighter">
        Modifier <span class="text-emerald-500">Catégorie</span>
      </h1>
      <div class="inline-block px-4 py-1 bg-slate-50 rounded-full border border-slate-100 mt-3">
        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">
          ID Catégorie: <span class="text-emerald-500">#{{ categorieId }}</span>
        </p>
      </div>
    </div>

    <form (ngSubmit)="onUpdate()" class="space-y-6">
      
      <div>
        <label class="block text-[10px] font-black uppercase text-slate-400 mb-2 ml-2 tracking-widest">Nom de la catégorie</label>
        <input type="text" [(ngModel)]="categorie.title" name="title"
               class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none font-bold text-slate-700 focus:border-emerald-500 focus:bg-white transition-all shadow-inner">
      </div>

      <div>
        <label class="block text-[10px] font-black uppercase text-slate-400 mb-2 ml-2 tracking-widest">Description</label>
        <textarea [(ngModel)]="categorie.description" name="description" rows="3"
                  class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none font-bold text-slate-700 focus:border-emerald-500 focus:bg-white transition-all shadow-inner"></textarea>
      </div>

      <div class="flex items-center justify-between p-6 bg-slate-50 rounded-2xl border border-slate-100">
        <div class="flex flex-col">
          <span class="text-xs font-black uppercase tracking-widest transition-colors duration-300" 
                [class]="categorie.is_active ? 'text-emerald-600' : 'text-slate-400'">
            {{ categorie.is_active ? 'Activé' : 'Désactivé' }}
          </span>
          <p class="text-[9px] font-bold text-slate-400 uppercase mt-0.5">État de la catégorie dans le système</p>
        </div>
        
        <label class="relative inline-flex items-center cursor-pointer group">
          <input type="checkbox" [(ngModel)]="categorie.is_active" name="is_active" class="sr-only peer">
          <div class="w-16 h-8 bg-slate-300 rounded-full peer 
                      peer-focus:ring-4 peer-focus:ring-emerald-500/10 
                      peer-checked:bg-emerald-500 
                      transition-all duration-300 ease-in-out
                      after:content-[''] after:absolute after:top-[4px] after:left-[4px] 
                      after:bg-white after:rounded-full after:h-6 after:w-6 
                      after:transition-all after:duration-300
                      peer-checked:after:translate-x-8">
          </div>
        </label>
      </div>

      <div class="grid grid-cols-2 gap-4 pt-4">
        <button type="button" (click)="cancel()" 
                class="py-4 bg-slate-100 text-slate-400 rounded-2xl font-black text-[10px] uppercase tracking-widest hover:bg-slate-200 transition-all active:scale-95">
          Annuler
        </button>
        <button type="submit" 
                class="py-4 bg-slate-900 text-white rounded-2xl font-black text-[10px] uppercase tracking-widest hover:bg-emerald-600 shadow-xl shadow-emerald-100 transition-all active:scale-95">
          Confirmer
        </button>
      </div>

    </form>
  </div>
</div>
