<div class="p-8 max-w-2xl mx-auto">
  <div class="flex items-center justify-between mb-10">
    <div>
      <h1 class="text-3xl font-black text-slate-900 tracking-tight">MODIFIER <span class="text-blue-600 italic">FOURNISSEUR</span></h1>
      <p class="text-xs text-slate-400 font-bold uppercase tracking-widest mt-1">ID: #{{ fournisseurId }} — Gestion du partenaire commercial</p>
    </div>
    <button routerLink="/admin/fournisseurs" class="p-3 bg-slate-100 text-slate-500 rounded-2xl hover:bg-red-50 hover:text-red-600 transition-all">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>
  </div>

  <div class="bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-xl shadow-slate-200/50 space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <div>
        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2 mb-2 block">Prénom</label>
        <input type="text" [(ngModel)]="fournisseurData.firstname" class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl focus:bg-white focus:border-blue-500 outline-none font-bold text-slate-700 transition-all">
      </div>

      <div>
        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2 mb-2 block">Nom</label>
        <input type="text" [(ngModel)]="fournisseurData.lastname" class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl focus:bg-white focus:border-blue-500 outline-none font-bold text-slate-700 transition-all">
      </div>

      <div class="md:col-span-2">
        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2 mb-2 block">Email </label>
        <input type="email" [(ngModel)]="fournisseurData.email" class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl focus:border-blue-500 outline-none font-bold text-slate-700 transition-all">
      </div>

      <div class="md:col-span-2">
        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2 mb-2 block">Pays & Téléphone</label>
        <div class="flex gap-2">
          <div (click)="showModal = true" class="flex items-center gap-2 px-4 py-4 bg-slate-100 rounded-2xl cursor-pointer hover:bg-slate-200 transition-all">
            <span class="fi fi-{{selectedCountry.short}} rounded-sm"></span>
            <span class="font-black text-slate-700 text-sm uppercase">{{selectedCountry.short}}</span>
            <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 9l-7 7-7-7"></path></svg>
          </div>
          <div class="flex-1 relative flex items-center bg-slate-50 rounded-2xl border border-slate-100">
            <span class="pl-4 font-bold text-slate-500 text-sm">{{selectedCountry.code}}</span>
            <input type="text" [(ngModel)]="fournisseurData.tel" placeholder="XX XXX XXX" class="w-full px-2 py-4 bg-transparent border-none focus:ring-0 font-bold text-slate-700 outline-none">
          </div>
        </div>
      </div>

      <div class="md:col-span-2">
        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2 mb-2 block">Adresse </label>
        <input type="text" [(ngModel)]="fournisseurData.adresse" class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl focus:border-blue-500 outline-none font-bold text-slate-700 transition-all">
      </div>

      <div class="md:col-span-2 flex items-center justify-between p-5 bg-slate-50/80 rounded-3xl border border-slate-100">
        <div class="flex flex-col">
          <div class="flex items-center gap-2">
            <span class="text-[10px] font-black text-slate-700 uppercase tracking-widest">Autorisation d'accès</span>
            <span [class]="fournisseurData.is_active ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'" class="px-2 py-0.5 rounded-full text-[8px] font-black uppercase">
              {{ fournisseurData.is_active ? 'Compte Actif' : 'Compte Bloqué' }}
            </span>
          </div>
          <span class="text-[9px] text-slate-400 font-bold uppercase mt-1">Activer ou bloquer les opérations</span>
        </div>
        <label class="relative inline-flex items-center cursor-pointer group">
          <input type="checkbox" [(ngModel)]="fournisseurData.is_active" class="sr-only peer">
          <div class="w-14 h-7 bg-slate-200 rounded-full peer peer-checked:after:translate-x-full peer-checked:bg-blue-600 after:content-[''] after:absolute after:top-[4px] after:left-[4px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all transition-colors duration-300"></div>
        </label>
      </div>
    </div>

    <button (click)="onUpdate()" [disabled]="loading" class="w-full mt-4 bg-slate-900 text-white py-5 rounded-[1.5rem] font-black text-sm uppercase tracking-[0.2em] hover:bg-blue-600 transition-all shadow-2xl flex items-center justify-center gap-3 active:scale-[0.98]">
      <span *ngIf="!loading">Sauvegarder les modifications</span>
      <div *ngIf="loading" class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
    </button>
  </div>
</div>
