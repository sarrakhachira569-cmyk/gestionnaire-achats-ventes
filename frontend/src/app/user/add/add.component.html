<style>
  input::-ms-reveal,
  input::-ms-clear {
    display: none;
  }

  /* التعديل الجديد باش يفتح لون الـ Placeholder */
  input::placeholder {
    color: #cbd5e1 !important; /* لون slate-300 فاتح ومزيان */
    opacity: 1; /* باش نضمنوا إنو اللون يظهر كيف ما هو في المتصفحات الكل */
  }

  /* للمتصفحات الأخرى كيف Edge و Chrome */
  input::-webkit-input-placeholder {
    color: #cbd5e1 !important;
  }

  /* 1. زدنا هذي باش الـ Scrollbar يكون مزيان */
  .custom-scroll::-webkit-scrollbar {
    width: 6px;
  }
  .custom-scroll::-webkit-scrollbar-thumb {
    background-color: #e2e8f0;
    border-radius: 10px;
  }
</style>

<div class="fixed inset-0 z-[150] flex items-start justify-center p-4 pt-10 overflow-y-auto bg-slate-900/40 backdrop-blur-sm">
  
  <div class="fixed inset-0 -z-10" (click)="cancel()"></div>

  <div class="relative bg-white w-full max-w-lg rounded-[2.5rem] shadow-2xl border border-slate-100 overflow-hidden animate-in fade-in zoom-in duration-300 flex flex-col max-h-[90vh]">
    
    <div class="px-10 pt-12 pb-6 text-center shrink-0">
      <div class="inline-flex items-center justify-center w-20 h-20 bg-indigo-600 rounded-[2rem] shadow-lg shadow-indigo-200 mb-6 rotate-3">
        <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
        </svg>
      </div>
      <h2 class="text-3xl font-black text-slate-900 tracking-tight"> 
        AJOUTER <span class="text-indigo-600">ADMIN</span>
      </h2>
    </div>

    <form #userForm="ngForm" (submit)="onSubmit(userForm)" autocomplete="off" class="px-10 pb-12 space-y-6 overflow-y-auto custom-scroll">
      
      <div class="grid grid-cols-2 gap-5">
        <div class="space-y-2">
          <label class="text-[11px] font-bold uppercase text-slate-500 ml-1 tracking-wider">Prénom</label>
          <input type="text" [(ngModel)]="newUser.first_name" name="first_name" #firstName="ngModel" required
                 [class.border-red-500]="firstName.invalid && (firstName.touched || userForm.submitted)"
                 class="w-full px-5 py-4 bg-slate-50 border border-slate-100 focus:border-indigo-500 rounded-2xl outline-none font-semibold text-slate-700 transition-all" 
                 placeholder="Saisir le prénom">
          <p *ngIf="firstName.invalid && (firstName.touched || userForm.submitted)" class="text-[10px] text-red-500 font-bold ml-2">Ce champ est obligatoire</p>
        </div>

        <div class="space-y-2">
          <label class="text-[11px] font-bold uppercase text-slate-500 ml-1 tracking-wider">Nom</label>
          <input type="text" [(ngModel)]="newUser.last_name" name="last_name" #lastName="ngModel" required
                 [class.border-red-500]="lastName.invalid && (lastName.touched || userForm.submitted)"
                 class="w-full px-5 py-4 bg-slate-50 border border-slate-100 focus:border-indigo-500 rounded-2xl outline-none font-semibold text-slate-700 transition-all" 
                 placeholder="Saisir le nom">
          <p *ngIf="lastName.invalid && (lastName.touched || userForm.submitted)" class="text-[10px] text-red-500 font-bold ml-2">Ce champ est obligatoire</p>
        </div>
      </div>

      <div class="space-y-2">
        <label class="text-[11px] font-bold uppercase text-slate-500 ml-1 tracking-wider">Adresse Email ✉️</label>
        <input type="email" [(ngModel)]="newUser.email" name="email" #email="ngModel" required email
               autocomplete="one-time-code"
               [class.border-red-500]="email.invalid && (email.touched || userForm.submitted)"
               class="w-full px-5 py-4 bg-slate-50 border border-slate-100 focus:border-indigo-500 rounded-2xl outline-none font-semibold text-slate-700 transition-all" 
               placeholder="exemple@gmail.com">
        <p *ngIf="email.invalid && (email.touched || userForm.submitted)" class="text-[10px] text-red-500 font-bold ml-2">Veuillez saisir un email valide</p>
      </div>

      <div class="space-y-2">
        <label class="text-[11px] font-bold uppercase text-slate-500 ml-1 tracking-wider">Mot de passe 🔑</label>
        <div class="relative">
          <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="newUser.password" name="password" #password="ngModel" required minlength="6"
                 autocomplete="new-password"
                 [class.border-red-500]="password.invalid && (password.touched || userForm.submitted)"
                 class="w-full pl-5 pr-14 py-4 bg-slate-50 border border-slate-100 focus:border-indigo-500 rounded-2xl outline-none font-semibold text-slate-700 transition-all" 
                 placeholder="••••••••">
          
          <button type="button" (click)="togglePassword()" 
                  class="absolute right-4 top-1/2 -translate-y-1/2 z-10 text-slate-400 hover:text-indigo-600 transition-colors w-8 h-8 flex items-center justify-center bg-transparent">
            <svg *ngIf="!showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
            </svg>
            <svg *ngIf="showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"></path>
            </svg>
          </button>
        </div>
        <p *ngIf="password.invalid && (password.touched || userForm.submitted)" class="text-[10px] text-red-500 font-bold ml-2">Le mot de passe est obligatoire (min 6 chars)</p>
      </div>

      <div class="space-y-2 pb-4">
        <label class="text-[11px] font-bold uppercase text-slate-500 ml-1 tracking-wider text-base">Photo de profil 📸</label>
        <input type="file" (change)="onFileSelected($event)" accept="image/*"
               class="w-full px-5 py-4 bg-slate-50 border border-slate-100 rounded-2xl cursor-pointer file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-black file:bg-indigo-600 file:text-white hover:file:bg-indigo-700">
      </div>

      <div class="flex items-center gap-4 pt-4 shrink-0">
        <button type="button" (click)="cancel()" class="flex-1 py-4 font-bold text-slate-500 hover:bg-slate-100 rounded-xl transition-all">
          Annuler
        </button>
        <button type="submit" class="flex-[2] bg-indigo-600 text-white py-4 rounded-xl font-bold uppercase hover:bg-indigo-700 transition-all">
          Confirmer l'ajout
        </button>
      </div>
    </form>
  </div>
</div>
