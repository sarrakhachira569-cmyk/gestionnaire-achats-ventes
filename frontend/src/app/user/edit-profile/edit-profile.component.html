<div class="p-6 sm:ml-64 bg-[#f8fafc] min-h-screen font-sans">
  <div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-[2.5rem] shadow-2xl shadow-indigo-100/50 border border-slate-100 p-10">
      
      <div class="mb-10 text-center">
        <h1 class="text-3xl font-black text-slate-900">Modifier le <span class="text-indigo-600">Profil 🪪</span></h1>
        <p class="text-slate-400 font-bold">Mettez à jour vos informations personnelles</p>
      </div>

      <form [formGroup]="editForm" (ngSubmit)="onSubmit()" class="space-y-6">
        
        <div class="flex flex-col items-center mb-8 space-y-4">
          <div class="relative group">
            <img [src]="avatarPreview || getAvatarUrl()" 
                 class="w-32 h-32 rounded-3xl border-4 border-indigo-50 object-cover shadow-lg">
            <label for="avatar-upload" class="absolute inset-0 flex items-center justify-center bg-black/40 rounded-3xl opacity-0 group-hover:opacity-100 cursor-pointer transition-opacity">
              <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
              </svg>
            </label>
            <input id="avatar-upload" type="file" class="hidden" (change)="onFileSelected($event)" accept="image/*">
          </div>
          <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Cliquez pour changer la photo</p>
        </div>

        <div class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl border border-slate-100 mb-6">
          <div class="flex items-center gap-3">
            <div [class]="editForm.get('is_active')?.value ? 'bg-green-500' : 'bg-red-500'" 
                 class="w-3 h-3 rounded-full shadow-sm transition-colors duration-300"></div>
            <span class="text-sm font-black text-slate-700 uppercase tracking-tight">Statut de disponibilité</span>
          </div>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" formControlName="is_active" class="sr-only peer">
            <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
          </label>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-2">
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Prénom</label>
            <input formControlName="first_name" type="text" 
                   class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none font-bold transition-all duration-300">
          </div>

          <div class="space-y-2">
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Nom</label>
            <input formControlName="last_name" type="text" 
                   class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none font-bold transition-all duration-300">
          </div>
        </div>

        <div class="space-y-2">
          <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Adresse Email</label>
          <input formControlName="email" type="email" 
                 class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none font-bold transition-all duration-300">
        </div>

        <div class="space-y-2">
          <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2"> Mot de passe 🔐</label>
          <div class="relative flex items-center">
            <input [type]="showPassword ? 'text' : 'password'" 
                   formControlName="password" 
                   placeholder="••••••••" 
                   class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none font-bold transition-all duration-300 pr-14">
            
            <button type="button" (click)="togglePassword()"
                    class="absolute right-5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-indigo-600 transition-colors flex items-center justify-center">
              <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
              <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.025 10.025 0 014.132-5.411m0 0L21 21m-2.102-2.102L12 12m4.125-4.125A3.5 3.5 0 1111.06 14.14l-4.125 4.125" />
              </svg>
            </button>
          </div>
        </div>

        <div *ngIf="message" class="p-4 rounded-xl text-center font-bold animate-pulse" 
             [ngClass]="message.includes('succès') ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'">
          {{ message }}
        </div>

        <div class="flex gap-4 pt-4">
          <button type="submit" [disabled]="loading" 
                  class="flex-1 py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-2xl shadow-xl shadow-indigo-200 transition-all active:scale-95 disabled:opacity-50">
            {{ loading ? 'Enregistrement...' : 'Enregistrer les modifications' }}
          </button>
          
          <button type="button" routerLink="/admin/profile" 
                  class="px-8 py-4 bg-slate-100 hover:bg-slate-200 text-slate-600 font-black rounded-2xl transition-all active:scale-95">
              Annuler
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
